name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Nothing here writes to the repository; a compromised step gets a read-only token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          # The word list is what stops a false-positive name spreading; the
          # tests that depend on it skip without it.
          sudo apt-get install -y -q wamerican
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,crypto,pdf]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -rs

      - name: Benchmark (recall floor)
        run: |
          stripii benchmark benchmarks/synthetic.jsonl \
            --profile health --match binary --min-recall 0.88

  test-minimal:
    # The default install has no dependencies at all. Prove it still works,
    # so an optional extra can never quietly become required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install without any extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Confirm no third-party imports are needed
        run: |
          python -c "import stripii; print(stripii.__version__)"
          python -m stripii scrub examples/discharge-summary.txt -p health -q
      - name: Test
        run: pytest -q

  audit:
    # Known vulnerabilities in every optional dependency, since the extras are
    # what parse untrusted PDFs and images.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install every extra that installs on Linux
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[crypto,pdf,docx,xlsx,ocr,photo,keychain]" pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable
