# stripii.nikhilrdeshpande.com: the landing page, served from an atomic release symlink.
# Installed by deploy/site.sh --setup to /etc/nginx/sites-available/ and linked into sites-enabled/.
# Same host and same pattern as nikhilrdeshpande.com. Only this file is managed; other sites are untouched.
#
# TLS: after the first --setup, run once on the host
#   certbot --nginx -d stripii.nikhilrdeshpande.com
# then copy the live file back here, as the main site does, so later --setup runs keep certbot's lines.
#
# The page promises that this server keeps no access log for it, so access_log stays off.

server {
    listen 80;
    listen [::]:80;
    server_name stripii.nikhilrdeshpande.com;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /var/www/stripii.nikhilrdeshpande.com/current;
    index index.html;
    autoindex off;
    etag on;
    client_max_body_size 1k;

    access_log off;
    error_log /var/log/nginx/stripii.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain image/svg+xml;

    # No scripts, no third-party anything: the policy says so in one line.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;

    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; try_files $uri =404; }
    location ~ (^|/)\. { return 404; }

    # One page. Anything else is a 404, and the download lives on the GitHub release, not here.
    location = / { try_files /index.html =404; }
    location ~ ^/(style\.css|img/[a-z0-9-]+\.(webp|png))$ { try_files $uri =404; }
    location / { return 404; }
}
